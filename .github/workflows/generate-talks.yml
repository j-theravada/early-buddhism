name: Refresh generated talk data

on:
  schedule:
    - cron: "12 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-generated-talk-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate talk and transcript data
        run: bun run generate-talks

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- app/generated/talks.json app/generated/transcripts app/generated/transcript-search-documents.json; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/generated/talks.json app/generated/transcripts app/generated/transcript-search-documents.json
          git commit -m "chore: refresh generated talk data"
          git push
